# Builds and verifies on every push and pull request against main.
#
# It runs THE SAME SCRIPTS a maintainer runs — §12.4. A pipeline that restates the local
# build in YAML drifts from it, and the drift is only discovered once one of the two is
# already wrong.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The warning ratchet is scoped to CI, so the local inner loop stays friendly. The
      # playground's project file reads GITHUB_ACTIONS for the same reason.
      - run: pnpm build

      - run: pnpm check

      # The published artefact, rendered. It is the only thing that catches the class of
      # defect that exists only after trimming - §10.8.
      - run: pnpm test:browser

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
